<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niş Roman Sitesi</title>
<style>
  :root {
    --bg: #fafaf8;
    --surface: #ffffff;
    --line: #e2e0da;
    --ink: #1c1b19;
    --muted: #767268;
    --accent: #b8562e;
    --accent-soft: #d17948;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 80px; }
  header.site {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 8px;
  }
  header.site h1 {
    font-size: 26px; margin: 0; font-weight: 700; letter-spacing: 0.5px;
    cursor: pointer; color: var(--ink);
  }
  header.site .tag { font-size: 11px; color: var(--muted); letter-spacing: 0.3px; }
  .notice {
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    font-size: 12px; padding: 8px 12px; margin-bottom: 16px; border-radius: 4px;
  }
  .userbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 24px; font-size: 14px;
  }
  .userbar .who { color: var(--muted); }
  .userbar .who b { color: var(--accent); font-weight: 600; }
  button, .btn {
    font-family: inherit; background: var(--ink); color: #fff; border: none;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 3px;
  }
  button:hover, .btn:hover { background: var(--accent); }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.ghost:hover { color: var(--accent); border-color: var(--accent); background: transparent; }
  button:disabled { opacity: 0.4; cursor: default; }
  .panel { background: var(--surface); border: 1px solid var(--line); padding: 20px; margin-bottom: 28px; border-radius: 6px; }
  .panel h2 { margin: 0 0 14px; font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: 0.3px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, textarea {
    width: 100%; font-family: inherit; font-size: 15px; padding: 9px 11px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    margin-bottom: 14px; border-radius: 3px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent-soft); }
  textarea { min-height: 120px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .error { color: var(--accent); font-size: 13px; margin: -6px 0 12px; display: none; }
  .hidden { display: none !important; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  .novel-list { margin-top: 8px; }
  .novel-card {
    padding: 18px 0; border-bottom: 1px solid var(--line);
    cursor: pointer; display: flex; justify-content: space-between; align-items: baseline;
  }
  .novel-card:hover .novel-title { color: var(--accent); }
  .novel-title { font-size: 19px; font-weight: 600; margin: 0 0 4px; }
  .novel-meta { font-size: 12px; color: var(--muted); }
  .novel-desc { font-size: 14px; color: var(--muted); margin-top: 4px; max-width: 420px; }
  .novel-pagecount {
    font-size: 11px; color: var(--accent-soft); white-space: nowrap;
    border: 1px solid var(--accent-soft); border-radius: 20px; padding: 3px 10px; height: fit-content;
  }

  .reader-header { margin-bottom: 18px; }
  .reader-header h2 { font-size: 22px; font-weight: 700; margin: 0 0 4px; color: var(--ink); }
  .reader-header .by { font-size: 13px; color: var(--accent-soft); }
  .page-body {
    background: var(--surface); border: 1px solid var(--line); padding: 26px 22px;
    min-height: 200px; margin-bottom: 14px; border-radius: 6px;
  }
  .page-body h3 { margin: 0 0 14px; font-size: 17px; font-weight: 700; color: var(--accent); }
  .page-body p { white-space: pre-wrap; margin: 0; font-size: 16px; color: var(--ink); }
  .page-nav {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; margin-bottom: 30px;
  }
  .page-nav .count { color: var(--muted); }
  .back-link {
    display: inline-block; margin-bottom: 18px; font-size: 13px; color: var(--muted);
    cursor: pointer;
  }
  .back-link:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">

  <header class="site">
    <h1 id="homeLink">Ciltli</h1>
    <div class="tag">sayfalı roman sitesi</div>
  </header>

  <div id="noticeArea"></div>
  <div class="userbar" id="userbar"></div>

  <div class="panel" id="authPanel">
    <h2 id="authTitle">Giriş yap</h2>
    <div id="loginForm">
      <label for="loginUser">Kullanıcı adı</label>
      <input id="loginUser" type="text" autocomplete="username">
      <label for="loginPass">Şifre</label>
      <input id="loginPass" type="password" autocomplete="current-password">
      <div class="error" id="loginError"></div>
      <div class="row">
        <button id="loginBtn">Giriş yap</button>
        <button class="ghost" id="toRegisterBtn">Hesabın yok mu? Kayıt ol</button>
      </div>
    </div>
    <div id="registerForm" class="hidden">
      <label for="regUser">Kullanıcı adı</label>
      <input id="regUser" type="text" autocomplete="username">
      <label for="regPass">Şifre</label>
      <input id="regPass" type="password" autocomplete="new-password">
      <div class="error" id="regError"></div>
      <div class="row">
        <button id="registerBtn">Kayıt ol</button>
        <button class="ghost" id="toLoginBtn">Zaten hesabın var mı? Giriş yap</button>
      </div>
    </div>
  </div>

  <div class="panel hidden" id="newNovelPanel">
    <h2>Yeni roman başlat</h2>
    <label for="novelTitle">Roman adı</label>
    <input id="novelTitle" type="text" placeholder="Romanının adı">
    <label for="novelDesc">Kısa tanıtım</label>
    <textarea id="novelDesc" placeholder="Romanın ne anlatıyor, kısaca yaz" style="min-height:70px;"></textarea>
    <div class="error" id="novelError"></div>
    <div class="row" style="justify-content:flex-end;">
      <button id="createNovelBtn">Romanı oluştur</button>
    </div>
  </div>

  <div id="mainArea" class="loading">Yükleniyor...</div>

</div>

<script>
(function() {
  let sessionUser = null;
  let novels = [];
  let currentNovel = null;
  let currentPages = [];
  let currentPageIndex = 0;

  const el = id => document.getElementById(id);
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function wait(ms) { return new Promise(res => setTimeout(res, ms)); }

  // ---------- Supabase connection (raw REST via fetch — avoids supabase-js's
  // internal Headers object, which the mobile preview sandbox can't postMessage) ----------
  const SUPABASE_URL = 'https://vadadmeetkvigsqvtlus.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_IZb7Cp5xuCvZF64pG3q7eA_w6UCY-7J';

  async function sbFetch(path, opts) {
    opts = opts || {};
    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    };
    if (opts.headers) Object.assign(headers, opts.headers);
    const res = await fetch(SUPABASE_URL + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body
    });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) {
      const msg = (data && (data.message || data.error_description || data.hint)) || res.statusText || 'Bilinmeyen hata';
      throw new Error(msg);
    }
    return data;
  }

  async function registerUser(username, password) {
    username = username.trim();
    if (!username || !password) throw new Error('Kullanıcı adı ve şifre gerekli.');
    if (username.length < 3) throw new Error('Kullanıcı adı en az 3 karakter olmalı.');
    if (password.length < 4) throw new Error('Şifre en az 4 karakter olmalı.');
    let ok;
    try {
      ok = await sbFetch('/rest/v1/rpc/register_user', {
        method: 'POST',
        body: JSON.stringify({ p_username: username, p_password: password })
      });
    } catch (e) {
      throw new Error('Kayıt sırasında bir sorun oluştu: ' + e.message);
    }
    if (ok === false) throw new Error('Bu kullanıcı adı zaten alınmış.');
    return { username };
  }

  async function loginUser(username, password) {
    username = username.trim();
    if (!username || !password) throw new Error('Kullanıcı adı ve şifre gerekli.');
    let ok;
    try {
      ok = await sbFetch('/rest/v1/rpc/verify_login', {
        method: 'POST',
        body: JSON.stringify({ p_username: username, p_password: password })
      });
    } catch (e) {
      throw new Error('Giriş sırasında bir sorun oluştu: ' + e.message);
    }
    if (ok === false) throw new Error('Kullanıcı adı veya şifre yanlış.');
    return { username };
  }

  async function loadNovels() {
    let data;
    try {
      data = await sbFetch('/rest/v1/novels?select=*&order=created_at.desc');
    } catch (e) { novels = []; return; }
    novels = (data || []).map(n => ({
      id: n.id, title: n.title, description: n.description || '', author: n.author,
      createdAt: new Date(n.created_at).getTime()
    }));
  }

  async function loadPagesFor(novelId) {
    let data;
    try {
      data = await sbFetch('/rest/v1/pages?novel_id=eq.' + encodeURIComponent(novelId) + '&select=*&order=page_index.asc');
    } catch (e) { return []; }
    return (data || []).map(p => ({
      novelId: p.novel_id, index: p.page_index, title: p.title || '', content: p.content,
      createdAt: new Date(p.created_at).getTime()
    }));
  }

  async function createNovel(title, description) {
    title = title.trim();
    description = description.trim();
    if (!title) throw new Error('Roman adı gerekli.');
    let data;
    try {
      data = await sbFetch('/rest/v1/novels', {
        method: 'POST',
        headers: { 'Prefer': 'return=representation' },
        body: JSON.stringify({ title, description, author: sessionUser.username })
      });
    } catch (e) {
      throw new Error('Roman oluşturulamadı: ' + e.message);
    }
    const n = Array.isArray(data) ? data[0] : data;
    return { id: n.id, title: n.title, description: n.description || '', author: n.author, createdAt: new Date(n.created_at).getTime() };
  }

  async function addPage(novelId, pageTitle, content) {
    pageTitle = pageTitle.trim();
    content = content.trim();
    if (!content) throw new Error('Sayfa metni boş olamaz.');
    const existingPages = await loadPagesFor(novelId);
    const nextIndex = existingPages.length;
    let data;
    try {
      data = await sbFetch('/rest/v1/pages', {
        method: 'POST',
        headers: { 'Prefer': 'return=representation' },
        body: JSON.stringify({ novel_id: novelId, page_index: nextIndex, title: pageTitle, content })
      });
    } catch (e) {
      throw new Error('Sayfa eklenemedi: ' + e.message);
    }
    const p = Array.isArray(data) ? data[0] : data;
    return { novelId: p.novel_id, index: p.page_index, title: p.title || '', content: p.content, createdAt: new Date(p.created_at).getTime() };
  }

  function renderUserbar() {
    const bar = el('userbar');
    bar.innerHTML = '';
    if (sessionUser) {
      const span = document.createElement('span');
      span.className = 'who';
      span.innerHTML = 'Hoş geldin, <b>' + escapeHtml(sessionUser.username) + '</b>';
      bar.appendChild(span);
      const btn = document.createElement('button');
      btn.className = 'ghost';
      btn.textContent = 'Çıkış yap';
      btn.onclick = () => { sessionUser = null; renderUserbar(); renderAuthArea(); showHome(); };
      bar.appendChild(btn);
    } else {
      const span = document.createElement('span');
      span.className = 'who';
      span.textContent = 'Romanları okumak için giriş yapmana gerek yok — yazmak için gerekiyor.';
      bar.appendChild(span);
    }
  }

  function renderAuthArea() {
    if (sessionUser) {
      el('authPanel').classList.add('hidden');
      el('newNovelPanel').classList.remove('hidden');
    } else {
      el('authPanel').classList.remove('hidden');
      el('newNovelPanel').classList.add('hidden');
      el('loginForm').classList.remove('hidden');
      el('registerForm').classList.add('hidden');
      el('authTitle').textContent = 'Giriş yap';
    }
  }

  function showError(id, msg) { const e = el(id); e.textContent = msg; e.style.display = 'block'; }
  function clearError(id) { const e = el(id); e.style.display = 'none'; e.textContent = ''; }

  async function showHome() {
    currentNovel = null;
    const area = el('mainArea');
    area.className = 'loading';
    area.textContent = 'Yükleniyor...';
    await loadNovels();
    area.className = '';
    if (novels.length === 0) {
      area.innerHTML = '<div class="empty">Henüz hiç roman yok. İlk romanı sen başlat.</div>';
      return;
    }
    area.innerHTML = '<div class="novel-list">' + novels.map(n => `
      <div class="novel-card" data-id="${escapeHtml(n.id)}">
        <div>
          <div class="novel-title">${escapeHtml(n.title)}</div>
          <div class="novel-meta">${escapeHtml(n.author)} · ${formatDate(n.createdAt)}</div>
          ${n.description ? '<div class="novel-desc">' + escapeHtml(n.description) + '</div>' : ''}
        </div>
        <div class="novel-pagecount" data-pagecount="${escapeHtml(n.id)}">...</div>
      </div>
    `).join('') + '</div>';
    area.querySelectorAll('.novel-card').forEach(card => {
      card.onclick = () => openNovel(card.getAttribute('data-id'));
    });
    for (const n of novels) {
      loadPagesFor(n.id).then(pages => {
        const badge = area.querySelector('[data-pagecount="' + n.id + '"]');
        if (badge) badge.textContent = pages.length + ' sayfa';
      });
    }
  }

  async function openNovel(novelId) {
    const n = novels.find(x => x.id === novelId);
    if (!n) return;
    currentNovel = n;
    const area = el('mainArea');
    area.className = 'loading';
    area.textContent = 'Yükleniyor...';
    currentPages = await loadPagesFor(novelId);
    currentPageIndex = 0;
    renderReader();
  }

  function renderReader() {
    const area = el('mainArea');
    area.className = '';
    const n = currentNovel;
    const isAuthor = sessionUser && sessionUser.username === n.author;
    let html = `<div class="back-link" id="backLink">‹ Tüm romanlar</div>`;
    html += `<div class="reader-header"><h2>${escapeHtml(n.title)}</h2><div class="by">${escapeHtml(n.author)}</div></div>`;

    if (currentPages.length === 0) {
      html += `<div class="empty">Bu romanda henüz sayfa yok.${isAuthor ? ' İlk sayfayı sen ekle.' : ''}</div>`;
    } else {
      const p = currentPages[currentPageIndex];
      html += `<div class="page-body">
        ${p.title ? '<h3>' + escapeHtml(p.title) + '</h3>' : ''}
        <p>${escapeHtml(p.content)}</p>
      </div>`;
      html += `<div class="page-nav">
        <button class="ghost" id="prevPageBtn" ${currentPageIndex === 0 ? 'disabled' : ''}>‹ Önceki</button>
        <span class="count">Sayfa ${currentPageIndex + 1} / ${currentPages.length}</span>
        <button class="ghost" id="nextPageBtn" ${currentPageIndex === currentPages.length - 1 ? 'disabled' : ''}>Sonraki ›</button>
      </div>`;
    }

    if (isAuthor) {
      html += `<div class="panel">
        <h2>Yeni sayfa ekle</h2>
        <label for="pageTitle">Sayfa başlığı (opsiyonel)</label>
        <input id="pageTitle" type="text" placeholder="Örn: Bölüm 3">
        <label for="pageContent">Metin</label>
        <textarea id="pageContent" placeholder="Bu sayfada ne oluyor..." style="min-height:140px;"></textarea>
        <div class="error" id="pageError"></div>
        <div class="row" style="justify-content:flex-end;">
          <button id="addPageBtn">Sayfayı ekle</button>
        </div>
      </div>`;
    }

    area.innerHTML = html;

    el('backLink').onclick = showHome;
    if (currentPages.length > 0) {
      const prevBtn = el('prevPageBtn');
      const nextBtn = el('nextPageBtn');
      if (prevBtn) prevBtn.onclick = () => { currentPageIndex--; renderReader(); };
      if (nextBtn) nextBtn.onclick = () => { currentPageIndex++; renderReader(); };
    }
    if (isAuthor) {
      el('addPageBtn').onclick = async () => {
        clearError('pageError');
        const btn = el('addPageBtn');
        btn.disabled = true;
        try {
          const page = await addPage(currentNovel.id, el('pageTitle').value, el('pageContent').value);
          currentPages.push(page);
          currentPageIndex = currentPages.length - 1;
          renderReader();
        } catch (e) {
          showError('pageError', e.message);
        } finally {
          const b = el('addPageBtn');
          if (b) b.disabled = false;
        }
      };
    }
  }

  el('homeLink').onclick = showHome;

  el('toRegisterBtn').onclick = () => {
    el('loginForm').classList.add('hidden');
    el('registerForm').classList.remove('hidden');
    el('authTitle').textContent = 'Kayıt ol';
    clearError('loginError');
  };
  el('toLoginBtn').onclick = () => {
    el('registerForm').classList.add('hidden');
    el('loginForm').classList.remove('hidden');
    el('authTitle').textContent = 'Giriş yap';
    clearError('regError');
  };

  el('loginBtn').onclick = async () => {
    clearError('loginError');
    const btn = el('loginBtn');
    btn.disabled = true;
    try {
      const user = await loginUser(el('loginUser').value, el('loginPass').value);
      sessionUser = { username: user.username };
      el('loginUser').value = ''; el('loginPass').value = '';
      renderUserbar(); renderAuthArea();
      if (currentNovel) renderReader();
    } catch (e) {
      showError('loginError', e.message);
    } finally { btn.disabled = false; }
  };

  el('registerBtn').onclick = async () => {
    clearError('regError');
    const btn = el('registerBtn');
    btn.disabled = true;
    try {
      const user = await registerUser(el('regUser').value, el('regPass').value);
      sessionUser = { username: user.username };
      el('regUser').value = ''; el('regPass').value = '';
      renderUserbar(); renderAuthArea();
      if (currentNovel) renderReader();
    } catch (e) {
      showError('regError', e.message);
    } finally { btn.disabled = false; }
  };

  el('createNovelBtn').onclick = async () => {
    clearError('novelError');
    if (!sessionUser) return;
    const btn = el('createNovelBtn');
    btn.disabled = true;
    try {
      const novel = await createNovel(el('novelTitle').value, el('novelDesc').value);
      el('novelTitle').value = ''; el('novelDesc').value = '';
      novels.unshift(novel);
      await openNovel(novel.id);
    } catch (e) {
      showError('novelError', e.message);
    } finally { btn.disabled = false; }
  };

  renderUserbar();
  renderAuthArea();
  showHome();
})();
</script>
</body>
</html>
